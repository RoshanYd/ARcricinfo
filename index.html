<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1b4b" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>ARcricinfo - Cricket Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#F6F3ED', // Soft Cream
              secondary: '#C2CBD3', // Cool Gray
              accent: '#313851', // Deep Navy Blue
              highlight: '#E63946', // Red for wickets/alerts
              success: '#2A9D8F', // Teal for boundaries
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
              'fade-in': 'fadeIn 0.5s ease-out',
              'scale-up': 'scaleUp 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleUp: {
                '0%': { transform: 'scale(0.5)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #F6F3ED;
        color: #313851;
        transition: background-color 0.3s, color 0.3s;
      }
      /* Hide scrollbar for clean UI */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F6F3ED;
      }
      ::-webkit-scrollbar-thumb {
        background: #C2CBD3;
        border-radius: 3px;
      }

      /* Dark Mode Global Variables and Overrides */
      html.dark body {
        background-color: #0f172a; /* slate-900 */
        color: #f8fafc; /* slate-50 */
      }
      html.dark .bg-white {
        background-color: #1e293b !important; /* slate-800 */
        border-color: #334155 !important;
      }
      html.dark .bg-gray-50, html.dark .bg-slate-50 {
        background-color: #0f172a !important; /* slate-900 */
        border-color: #1e293b !important;
      }
      html.dark .text-gray-900, html.dark .text-gray-800, html.dark .text-slate-900 {
        color: #f1f5f9 !important; /* slate-100 */
      }
      html.dark .text-gray-600, html.dark .text-gray-500 {
        color: #94a3b8 !important; /* slate-400 */
      }
      html.dark .border-gray-100, html.dark .border-gray-200, html.dark .border-gray-300 {
        border-color: #334155 !important; /* slate-700 */
      }
      html.dark .bg-primary {
          background-color: #0f172a !important;
      }
      html.dark input, html.dark select, html.dark textarea {
        background-color: #0f172a !important;
        color: #f1f5f9 !important;
        border-color: #334155 !important;
      }
      html.dark ::-webkit-calendar-picker-indicator {
        filter: invert(1);
      }
      html.dark ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
