# ─── Horizontal Pod Autoscaler ───────────────────────────────────────────────
# Frontend HPA — scales 2→5 replicas when CPU > 70%
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arcricinfo-frontend-hpa
  namespace: arcricinfo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arcricinfo-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Backend HPA — scales 2→6 replicas when CPU > 60% or memory > 70%
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arcricinfo-backend-hpa
  namespace: arcricinfo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arcricinfo-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
