# ─── Frontend Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: arcricinfo-frontend-svc
  namespace: arcricinfo
  labels:
    app: arcricinfo-frontend
spec:
  selector:
    app: arcricinfo-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
