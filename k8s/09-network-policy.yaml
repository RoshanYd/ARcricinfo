# ─── Network Policy ───────────────────────────────────────────────────────────
# Default-deny all ingress within the namespace; only allow what's declared below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: arcricinfo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Frontend: allow ingress from Ingress controller + allow egress to backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
  namespace: arcricinfo
spec:
  podSelector:
    matchLabels:
      app: arcricinfo-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: arcricinfo-backend
      ports:
        - port: 4000
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
---
# Backend: allow ingress from frontend + Ingress controller; allow egress to Supabase (HTTPS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-netpol
  namespace: arcricinfo
spec:
  podSelector:
    matchLabels:
      app: arcricinfo-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: arcricinfo-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 4000
  egress:
    # Supabase HTTPS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
