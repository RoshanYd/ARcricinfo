# ─── Ingress (Nginx Ingress Controller) ──────────────────────────────────────
# Routes:
#   /api/*   → arcricinfo-backend-svc:4000
#   /socket.io/* → arcricinfo-backend-svc:4000  (WebSocket upgrade)
#   /*       → arcricinfo-frontend-svc:80
#
# Prerequisites:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml
#
# TLS: Replace "arcricinfo.yourdomain.com" with your real domain.
# Cert-manager (https://cert-manager.io) will auto-provision Let's Encrypt certs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcricinfo-ingress
  namespace: arcricinfo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support (required for Socket.IO)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # TLS via cert-manager (comment out if no cert-manager installed)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - arcricinfo.yourdomain.com
      secretName: arcricinfo-tls
  rules:
    - host: arcricinfo.yourdomain.com
      http:
        paths:
          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: arcricinfo-backend-svc
                port:
                  number: 4000
          # Socket.IO WebSocket path
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: arcricinfo-backend-svc
                port:
                  number: 4000
          # Frontend SPA — catch-all
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arcricinfo-frontend-svc
                port:
                  number: 80
